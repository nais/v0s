syntax = "proto3";

package v0s.v1;

import "google/protobuf/timestamp.proto";

option go_package = "github.com/nais/v0s/api/v0s/v1;v0sv1";

// The API has no authentication. NetworkPolicy limits who reaches it, and callers are trusted
// services: they decide what their users may see and authorize suppression changes.
// v0s keeps the results updated; callers use its current view without checking inventory age
// or a target scan DB version. There is no client-facing freshness protocol.

// Vulnerabilities exposes mechanical facts about vulnerabilities in the images of team workloads.
// Nothing here is a judgement: no priority, no risk score. Everything is readable by every
// caller: team filters narrow a query, they do not restrict it.
service VulnerabilityService {
  // ListWorkloads lists team workloads, the image each is deployed with, and its SBOM/scan coverage.
  rpc ListWorkloads(ListWorkloadsRequest) returns (ListWorkloadsResponse);
  // ListFindings lists the findings of workloads. A finding in an image used by several
  // workloads is listed once for each of them. Filter by vulnerability and include
  // suppressed findings to discover other affected workloads before an explicit batch assessment.
  rpc ListFindings(ListFindingsRequest) returns (ListFindingsResponse);
  // ListVulnerabilities groups current workload findings after applying FindingFilter.
  // Advisory details remain available through GetVulnerability.
  rpc ListVulnerabilities(ListVulnerabilitiesRequest) returns (ListVulnerabilitiesResponse);
  // CountFindings counts findings as ListFindings lists them, grouped by one dimension.
  rpc CountFindings(CountFindingsRequest) returns (CountFindingsResponse);
  // GetSummary returns global finding aggregates and coverage for one workload
  // selection. Team-scoped and tenant-wide reads use this same operation.
  rpc GetSummary(GetSummaryRequest) returns (GetSummaryResponse);
  // GetVulnerability returns the vulnerability record for an ID or alias.
  rpc GetVulnerability(GetVulnerabilityRequest) returns (GetVulnerabilityResponse);
  // SearchComponents finds packages in SBOMs of images in use, whether or not they have findings.
  rpc SearchComponents(SearchComponentsRequest) returns (SearchComponentsResponse);
}

// Suppressions manages teams' durable assessments of findings, owned by v0s. Only the current
// state is kept; the caller keeps the history of changes if it wants one.
service SuppressionService {
  // SetSuppressions sets suppressions atomically, replacing any with the same key.
  // Each item targets one workload in the authorized team; no other workloads inherit it.
  rpc SetSuppressions(SetSuppressionsRequest) returns (SetSuppressionsResponse);
  // DeleteSuppressions deletes suppressions atomically. Deleting one that does not exist is not an error.
  rpc DeleteSuppressions(DeleteSuppressionsRequest) returns (DeleteSuppressionsResponse);
  // ListSuppressions lists suppressions.
  rpc ListSuppressions(ListSuppressionsRequest) returns (ListSuppressionsResponse);
  rpc ForwardV13sSuppression(ForwardV13sSuppressionRequest) returns (ForwardV13sSuppressionResponse);
}

enum Severity {
  SEVERITY_UNSPECIFIED = 0;
  SEVERITY_UNKNOWN = 1;
  SEVERITY_LOW = 2;
  SEVERITY_MEDIUM = 3;
  SEVERITY_HIGH = 4;
  SEVERITY_CRITICAL = 5;
}

// How far an image has got towards having findings.
enum ImageStatus {
  IMAGE_STATUS_UNSPECIFIED = 0;
  // The SBOM is not fetched or the image not scanned yet.
  IMAGE_STATUS_PENDING = 1;
  // A scan completed; see scanned_at on the image.
  IMAGE_STATUS_SCANNED = 2;
  // No attested SBOM was found for the image.
  IMAGE_STATUS_NO_SBOM = 3;
  // Fetching, verifying or scanning failed; see error.
  IMAGE_STATUS_FAILED = 4;
}

enum ImageErrorCode {
  IMAGE_ERROR_CODE_UNSPECIFIED = 0;
  IMAGE_ERROR_CODE_ATTESTATION_REJECTED = 1;
}

enum SuppressionState {
  SUPPRESSION_STATE_UNSPECIFIED = 0;
  SUPPRESSION_STATE_NOT_AFFECTED = 1;
  SUPPRESSION_STATE_FALSE_POSITIVE = 2;
  SUPPRESSION_STATE_ACCEPTED_RISK = 3;
}

message Image {
  reserved 3, 4, 6, 7;
  reserved "scanned_db_version";
  string name = 1;
  string digest = 2;
  ImageStatus status = 8;
  // Why the last fetch or scan failed. Also set on a SCANNED image whose rescan with a newer
  // vulnerability DB failed; its findings are still those of the last successful scan.
  string error = 9;
  google.protobuf.Timestamp scanned_at = 5;
  // Safe classification of the last failure; unspecified for unclassified failures or no error.
  ImageErrorCode error_code = 10;
}

message Workload {
  string environment = 1;
  string team = 2;
  string name = 3;
  // The image as deployed, e.g. "ghcr.io/navikt/app:1.2.3". Tags are resolved once while in use;
  // changes to what an existing tag points to are not tracked.
  string image_reference = 5;
  // The image image_reference resolved to. Unset if it could not be resolved; see resolve_error.
  Image image = 4;
  string resolve_error = 6;
  // Present only when ListWorkloadsRequest.overview is supplied.
  WorkloadFindingCounts finding_counts = 7;
}

// FindingFilter narrows findings. Empty fields do not filter. Severities match any value.
// A workload name requires both team and environment.
message FindingFilter {
  reserved 1, 6;
  reserved "teams", "kev", "vulnerability_id";
  string team = 12;
  string environment = 2;
  string workload = 3;
  string image_name = 4;
  string image_digest = 5;
  // Package key or full purl. A full purl matches only that version.
  string package = 7;
  repeated Severity severities = 8;
  // Only findings with a known fixed version.
  bool has_fix = 9;
  // Only findings for vulnerabilities known exploited in the wild according to CISA KEV.
  bool only_known_exploited = 10;
  SuppressedFilter suppressed = 11;
  // Match any listed vulnerability ID or alias.
  repeated string vulnerability_ids = 13;
  // Purl type, e.g. "npm" or "maven", case-insensitive and combined with other filters.
  // Empty does not filter; unknown types match nothing; malformed types are InvalidArgument.
  string package_type = 14;
}

enum SuppressedFilter {
  // Defaults to EXCLUDE.
  SUPPRESSED_FILTER_UNSPECIFIED = 0;
  SUPPRESSED_FILTER_EXCLUDE = 1;
  SUPPRESSED_FILTER_INCLUDE = 2;
  SUPPRESSED_FILTER_ONLY = 3;
}

// A vulnerability in a package in a workload's image.
message Finding {
  reserved 8, 12, 13, 15;
  reserved "status", "title", "cvss_score", "kev";
  WorkloadRef workload = 1;
  Image image = 2;
  string vulnerability_id = 3;
  string purl = 4;
  string package_key = 5;
  string installed_version = 6;
  string fixed_version = 7;
  // Severity as the source named in severity_source rates it.
  Severity severity = 9;
  string severity_source = 10;
  // Advisory source that produced the match, e.g. "ghsa", "alpine".
  string data_source = 11;
  Epss epss = 14;
  // Known exploited in the wild according to CISA KEV, not proof this workload is exploitable.
  // False means not listed, not proof of no exploitation.
  // Reads fail with Unavailable until a catalog has been loaded.
  bool known_exploited = 17;
  // This workload's suppression of the finding, unset if not suppressed.
  Suppression suppression = 16;
}

message Epss {
  reserved 2;
  reserved "percentile";
  double score = 1;
  string date = 3;
}

message ListWorkloadsRequest {
  reserved 1;
  reserved "teams";
  string team = 5;
  string environment = 2;
  // Requires team and environment.
  string workload = 6;
  int32 page_size = 3;
  string page_token = 4;
  // Opt in to per-workload finding counts. Without this,
  // the response is unchanged, with no KEV dependency. Legacy cursors remain
  // unchanged when workload_selector is also omitted.
  WorkloadOverviewOptions overview = 7;
  // Intersect with the existing scope, in both legacy and overview modes.
  WorkloadSelector workload_selector = 8;
}

message ListWorkloadsResponse {
  reserved 3;
  reserved "cursors";
  repeated Workload workloads = 1;
  // Overview tokens bind the scope, workload selection and finding filter,
  // not page size. Invalid or incompatible tokens return InvalidArgument;
  // restart without a token. Plain workload tokens are not interchangeable.
  string next_page_token = 2;
  // Overview mode only: size of the full workload selection, even on empty
  // pages. Retained because nais/api checks field presence for overview support.
  optional int64 total_count = 4;
}

message WorkloadOverviewOptions {
  reserved 2, 3;
  reserved "affected_only", "order_by";
  // Counts matching findings without removing workloads with zero matches.
  // Scope comes only from ListWorkloadsRequest scope and workload_selector:
  // team/environment/workload in this filter must be empty (InvalidArgument).
  FindingFilter finding_filter = 1;
}

message WorkloadOrderBy {
  option deprecated = true;
  reserved 1, 2;
  reserved "field", "direction";

  enum Field {
    reserved 1, 2;
    reserved "FIELD_WORKLOAD", "FIELD_FINDING_COUNT";
    FIELD_UNSPECIFIED = 0;
  }

  enum Direction {
    reserved 1, 2;
    reserved "DIRECTION_ASC", "DIRECTION_DESC";
    DIRECTION_UNSPECIFIED = 0;
  }
}

message WorkloadFindingCounts {
  // Workload/package occurrences after applying the finding filter.
  int64 finding_count = 1;
  int64 unique_vulnerability_count = 2;
  // Each canonical vulnerability contributes once at its highest known matching
  // severity. UNKNOWN only if all matching findings are UNKNOWN. No CVSS.
  // The sum equals unique_vulnerability_count.
  VulnerabilitySeverityCounts severity_counts = 3;
  // Distinct matching canonical vulnerabilities in CISA KEV.
  // Overview requests fail with Unavailable until a KEV catalog is loaded;
  // missing catalog data must never be represented as zero.
  int64 unique_kev_vulnerability_count = 4;
}

message VulnerabilitySeverityCounts {
  int64 critical = 1;
  int64 high = 2;
  int64 medium = 3;
  int64 low = 4;
  int64 unknown = 5;
}

message GetSummaryRequest {
  string team = 1;
  string environment = 2;
  // Requires team and environment.
  string workload = 3;
  // Intersect with scope. Omitted: no extra restriction; present-empty: none.
  WorkloadSelector workload_selector = 4;
  // Filter findings before aggregation, without affecting coverage.
  // team/environment/workload must be empty; scope comes only from this request.
  // Suppressed findings are excluded by default.
  FindingFilter finding_filter = 5;
}

// All counts use one database snapshot. KEV availability is required even for an
// empty selection (Unavailable otherwise), as in workload overview reads.
message GetSummaryResponse {
  // Matching workload/package occurrences; shared images count per workload.
  int64 finding_count = 1;
  // Distinct canonical IDs across the entire filtered selection, not the sum
  // of per-workload unique counts. Aliases do not multiply counts.
  int64 unique_vulnerability_count = 2;
  int64 affected_workload_count = 3;
  // Each canonical ID contributes once, at its highest known matching severity
  // across the entire selection. UNKNOWN only if all matching findings are
  // UNKNOWN. The sum equals unique_vulnerability_count; no CVSS-derived severity.
  VulnerabilitySeverityCounts severity_counts = 4;
  int64 unique_kev_vulnerability_count = 5;
  // Distinct workloads with at least one matching KEV finding.
  int64 kev_affected_workload_count = 6;
  // All selected workloads, unaffected by finding_filter.
  WorkloadCoverage coverage = 7;
}

// Counts workloads, not images. The five mutually exclusive categories sum to
// total_workload_count. Zero findings or SCANNED does not prove a clean image.
message WorkloadCoverage {
  int64 total_workload_count = 1;
  // A successful scan remains SCANNED if a later rescan fails.
  int64 scanned_count = 2;
  int64 pending_count = 3;
  int64 no_sbom_count = 4;
  int64 failed_count = 5;
  // No resolved image; separate from image/scan failures.
  int64 unresolved_image_count = 6;
}

message ListFindingsRequest {
  FindingFilter filter = 1;
  int32 page_size = 2;
  string page_token = 3;
  // Omitted: environment, team, workload, vulnerability ID and purl ASC.
  // When present, both field and direction are required.
  FindingOrderBy order_by = 4;
  WorkloadSelector workload_selector = 5;
}

message FindingOrderBy {
  Field field = 1;
  Direction direction = 2;

  enum Field {
    FIELD_UNSPECIFIED = 0;
    // DESC: CRITICAL, HIGH, MEDIUM, LOW, UNKNOWN.
    // ASC: LOW, MEDIUM, HIGH, CRITICAL, UNKNOWN.
    // Ties: vulnerability ID ASC, then environment, team, workload and purl ASC.
    FIELD_SEVERITY = 1;
    // Ties: environment, team, workload and purl ASC.
    FIELD_VULNERABILITY_ID = 2;
  }

  enum Direction {
    DIRECTION_UNSPECIFIED = 0;
    DIRECTION_ASC = 1;
    DIRECTION_DESC = 2;
  }
}

message ListFindingsResponse {
  // Ordered according to order_by, or the documented default when omitted.
  repeated Finding findings = 1;
  string next_page_token = 2;
  // One cursor per finding, in the same order. Each can be used as page_token
  // to continue after that finding, including when it is no longer present.
  // Opaque, versioned and bound to the normalized filter and order, not page_size.
  // Incompatible/legacy cursors or changed filters/orders return InvalidArgument;
  // restart without a token. Pages use live data, not a cross-request snapshot.
  repeated string cursors = 3;
  // Full filtered selection, independent of cursor, page size and ordering.
  repeated PackageTypeCount package_type_counts = 4;
}

message PackageTypeCount {
  string value = 1;
  int64 count = 2;
}

message ListVulnerabilitiesRequest {
  FindingFilter filter = 1;
  // Defaults to 100, capped at 1000.
  int32 page_size = 2;
  string page_token = 3;
  // Omitted means severity DESC. When present, both fields are required.
  VulnerabilityOrderBy order_by = 4;
  WorkloadSelector workload_selector = 5;
}

message VulnerabilityOrderBy {
  Field field = 1;
  Direction direction = 2;

  enum Field {
    FIELD_UNSPECIFIED = 0;
    // DESC: CRITICAL, HIGH, MEDIUM, LOW, UNKNOWN.
    // ASC: LOW, MEDIUM, HIGH, CRITICAL, UNKNOWN.
    FIELD_SEVERITY = 1;
    // Bytewise, case-sensitive PostgreSQL COLLATE "C", not natural/numeric ordering.
    FIELD_VULNERABILITY_ID = 2;
    FIELD_AFFECTED_WORKLOAD_COUNT = 3;
  }

  enum Direction {
    DIRECTION_UNSPECIFIED = 0;
    DIRECTION_ASC = 1;
    DIRECTION_DESC = 2;
  }
}

message VulnerabilitySummary {
  string vulnerability_id = 1;
  // Highest known severity among matching findings; UNKNOWN if all are UNKNOWN.
  Severity severity = 2;
  // Matching workload/package occurrences, including each workload sharing an image.
  int64 finding_count = 3;
  // Distinct (environment, team, workload name) tuples among matching findings.
  int64 affected_workload_count = 4;
}

message ListVulnerabilitiesResponse {
  // Severity/count ties use canonical ID ASC with COLLATE "C".
  repeated VulnerabilitySummary vulnerabilities = 1;
  string next_page_token = 2;
  // One opaque, versioned cursor per row, including the last page. Bound to the
  // effective filter/order, not page size; works after the boundary row disappears.
  // Invalid/incompatible tokens or changed filter/order give InvalidArgument:
  // restart without a token. Pages are live data, not a snapshot between calls.
  repeated string cursors = 3;
  // All unique canonical IDs after filtering, before cursor/LIMIT, even on empty pages.
  int64 total_count = 4;
}

message CountFindingsRequest {
  FindingFilter filter = 1;
  GroupBy group_by = 2;
  WorkloadSelector workload_selector = 3;

  enum GroupBy {
    GROUP_BY_UNSPECIFIED = 0;
    GROUP_BY_SEVERITY = 1;
    GROUP_BY_TEAM = 2;
    GROUP_BY_WORKLOAD = 3;
    GROUP_BY_IMAGE = 4;
    GROUP_BY_VULNERABILITY = 5;
  }
}

message CountFindingsResponse {
  repeated Bucket buckets = 1;

  message Bucket {
    // Value of the grouped dimension. For WORKLOAD: "environment/team/name". For IMAGE: "name@digest".
    string key = 1;
    int64 count = 2;
  }
}

message GetVulnerabilityRequest {
  string id = 1;
}

message GetVulnerabilityResponse {
  Vulnerability vulnerability = 1;
}

message Vulnerability {
  reserved 5, 6, 8, 9, 11;
  reserved "severities", "cvss", "published_at", "modified_at", "kev";
  string id = 1;
  repeated string aliases = 2;
  string title = 3;
  string description = 4;
  repeated string references = 7;
  Epss epss = 10;
  // Known exploited in the wild according to CISA KEV.
  // False means not listed, not proof of no exploitation.
  // Reads fail with Unavailable until a catalog has been loaded.
  bool known_exploited = 12;
}

message SearchComponentsRequest {
  reserved 2;
  reserved "teams";
  // Package key, full purl, or name prefix (case-insensitive) when it does not start with "pkg:".
  string query = 1;
  string team = 5;
  int32 page_size = 3;
  string page_token = 4;
}

message SearchComponentsResponse {
  repeated ComponentMatch matches = 1;
  string next_page_token = 2;
}

message ComponentMatch {
  string purl = 1;
  string name = 2;
  string version = 3;
  Image image = 4;
  // Workloads currently using the image, limited to the requested team.
  repeated WorkloadRef workloads = 5;
}

message WorkloadRef {
  string environment = 1;
  string team = 2;
  string name = 3;
}

// An externally computed workload selection, intersected with all existing scope
// and finding filters before aggregation and pagination. Omitted: no extra
// restriction. Present with no workloads: match nothing, never all workloads.
// All three WorkloadRef fields are required; invalid entries are InvalidArgument.
// Order and duplicates do not matter. Unknown/deleted workloads match nothing.
// There is no separate entry-count limit; the server's 4 MiB gRPC receive limit
// applies to the whole request (ResourceExhausted). Never truncated.
// Cursors bind the normalized selection; changing it requires restarting.
message WorkloadSelector {
  repeated WorkloadRef workloads = 1;
}

// Identifies a suppression within the request's team. Environment and workload are required.
message SuppressionKey {
  string image_name = 1;
  // Package key or full purl. Version, qualifiers and subpath are dropped.
  string package = 2;
  // Vulnerability ID or alias. Must resolve to exactly one vulnerability.
  string vulnerability_id = 3;
  string environment = 4;
  string workload = 5;
}

// An assessment for one environment/team/workload and image name, independent of image and
// package versions. Other workloads never inherit it, even when they share the image.
message Suppression {
  reserved 9;
  string team = 1;
  string image_name = 2;
  string package_key = 3;
  string vulnerability_id = 4;
  SuppressionState state = 5;
  // Why, in the team's words.
  string detail = 6;
  string updated_by = 7;
  google.protobuf.Timestamp updated_at = 8;
  string environment = 10;
  string workload = 11;
}

message NewSuppression {
  reserved 4;
  SuppressionKey key = 1;
  SuppressionState state = 2;
  string detail = 3;
}

message SetSuppressionsRequest {
  // The team whose assessments these are. The caller has authorized the actor for it.
  string team = 1;
  // Identity of the human the caller acts for.
  string actor = 2;
  repeated NewSuppression suppressions = 3;
}

message SetSuppressionsResponse {
  repeated Suppression suppressions = 1;
}

message DeleteSuppressionsRequest {
  // The team the suppressions belong to. The caller has authorized the actor for it.
  string team = 1;
  repeated SuppressionKey keys = 2;
}

message DeleteSuppressionsResponse {
  // The suppressions that existed and were deleted.
  repeated Suppression deleted = 1;
}

message ListSuppressionsRequest {
  reserved 1;
  reserved "teams";
  string team = 8;
  string image_name = 2;
  // Vulnerability ID or alias.
  string vulnerability_id = 3;
  int32 page_size = 4;
  string page_token = 5;
  string environment = 6;
  // Requires team and environment.
  string workload = 7;
}

message ListSuppressionsResponse {
  // Ordered by team, environment, workload, image name, package key and vulnerability ID.
  repeated Suppression suppressions = 1;
  string next_page_token = 2;
  // One cursor per suppression, in the same order. Each can be used as page_token
  // to continue after that suppression, including when it has been deleted.
  repeated string cursors = 3;
}

message ForwardV13sSuppressionRequest {
  string image_name = 1;
  string package = 2;
  repeated string vulnerability_ids = 3;
  V13sAssessment assessment = 4;
}

message V13sAssessment {
  SuppressionState state = 1;
  string detail = 2;
  string updated_by = 3;
  google.protobuf.Timestamp updated_at = 4;
}

message ForwardV13sSuppressionResponse {
  ForwardOutcome outcome = 1;
  int32 applied = 2;
  int32 removed = 3;
}

enum ForwardOutcome {
  FORWARD_OUTCOME_UNSPECIFIED = 0;
  FORWARD_OUTCOME_APPLIED = 1;
  FORWARD_OUTCOME_NO_WORKLOADS = 2;
  FORWARD_OUTCOME_UNKNOWN_VULNERABILITY = 3;
  FORWARD_OUTCOME_AMBIGUOUS_VULNERABILITY = 4;
}
