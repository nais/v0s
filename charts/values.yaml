replicas: 1

image:
  repository: europe-north1-docker.pkg.dev/nais-io/nais/images/v0s
  # Set explicitly for local installs; packaged releases can use Chart.appVersion.
  tag: ""

# Computed by Fasit from v0s_serviceaccount_email, provisioned by the management module.
# Set explicitly only when rendering or installing outside Fasit.
serviceAccountEmail: ""

# New installations provision CNPG through the shared nais-postgresql subchart.
# Set false to keep an existing, independently managed database without adoption.
postgresqlEnabled: true
postgresql:
  # Keep stable: changing this creates a new database, not a rename.
  fullnameOverride: v0s-db
  keep: true
  imageName: ghcr.io/cloudnative-pg/postgresql:18@sha256:899d3ed526b659d77935dde0e6bf2d69dbbf17d3d8c6486ca8cfd04bd3c18533
  database:
    # Bootstrap only; does not modify an existing database or owner.
    name: v0s
    owner: v0s
  storage:
    # The management cluster's standard-rwo does not support N4 nodes.
    storageClass: dynamic-rwo
  networkPolicy:
    # DNS and API-server access come from nais-netpols-management.
    enabled: true

# Used only when postgresqlEnabled=false. CNPG supplies <clusterName>-app.uri.
database:
  clusterName: v0s-db

github:
  organizations:
    - nais

trivyDBRepositories:
  - europe-north1-docker.pkg.dev/nais-io/github-ptc/aquasecurity/trivy-db:2
  - ghcr.io/aquasecurity/trivy-db:2

resources:
  requests:
    cpu: 200m
    memory: 1Gi
  limits:
    memory: 3Gi

networkPolicy:
  httpsHosts:
    - europe-north1-docker.pkg.dev
    - ghcr.io
    - pkg-containers.githubusercontent.com
    - index.docker.io
    - registry-1.docker.io
    - auth.docker.io
    - production.cloudflare.docker.com
    - gcr.io
    - gke.gcr.io
    - quay.io
    - registry.k8s.io
    - us-central1-docker.pkg.dev
    - reg.kyverno.io
    - tuf-repo-cdn.sigstore.dev
    - sigstore-tuf-root.storage.googleapis.com
    - www.googleapis.com
    - oauth2.googleapis.com
    - private.googleapis.com
    - epss.empiricalsecurity.com
    - www.cisa.gov
