apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .Release.Name }}
  labels:
    app: {{ .Release.Name }}
  annotations:
    iam.gke.io/gcp-service-account: {{ required "Set serviceAccountEmail from the provisioned v0s_serviceaccount_email Fasit environment value" .Values.serviceAccountEmail | quote }}
automountServiceAccountToken: false
