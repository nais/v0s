apiVersion: networking.gke.io/v1alpha3
kind: FQDNNetworkPolicy
metadata:
  name: {{ .Release.Name }}-fqdn
spec:
  podSelector:
    matchLabels:
      app: {{ .Release.Name }}
  policyTypes: [Egress]
  egress:
    - ports:
        - port: 443
          protocol: TCP
      to:
        - fqdns:
            {{- required "Set networkPolicy.httpsHosts to the required registry and data-source hosts" .Values.networkPolicy.httpsHosts | toYaml | nindent 12 }}
