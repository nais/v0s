environmentKinds:
  - management

# Allow CNPG bootstrap, disk provisioning and the cold Trivy cache download.
timeout: 15m

dependencies:
  - allOf:
      - nais-api
      - nais-netpols-management
      - cloudnative-pg
      - fqdn-policy
      - monitoring-crds

values:
  image.tag:
    displayName: Image tag override
    description: Defaults to the chart's appVersion; must refer to a published v0s image.
    config:
      type: string

  serviceAccountEmail:
    displayName: Runtime Google service account
    description: Provisioned by the management module with registry read access. Not the gh-v0s publisher.
    computed:
      template: |
        {{ .Env.v0s_serviceaccount_email | quote }}

  postgresqlEnabled:
    displayName: Provision PostgreSQL
    description: Defaults to true. Set false to use an existing database without adopting or changing it.
    config:
      type: bool

  postgresql.instances:
    displayName: PostgreSQL instances
    description: Defaults to three total instances with required node anti-affinity. Replicas are not backups.
    config:
      type: int

  postgresql.storage.size:
    displayName: PostgreSQL storage per instance
    description: Defaults to 10Gi. Expansion requires StorageClass support; shrinking is unsupported.
    config:
      type: string

  database.clusterName:
    displayName: Existing CNPG cluster
    description: Used only when postgresqlEnabled=false; must supply the application Secret in the release namespace.
    config:
      type: string

  github.organizations:
    displayName: Trusted GitHub organizations
    description: Only SBOM attestations signed by workflows in these organizations are accepted.
    config:
      type: string_array

  networkPolicy.httpsHosts:
    displayName: Allowed HTTPS hosts
    description: Registries, redirects, Sigstore trust roots and vulnerability data sources used by v0s.
    config:
      type: string_array

  resources.requests.cpu:
    displayName: CPU request
    config:
      type: string

  resources.requests.memory:
    displayName: Memory request
    config:
      type: string

  resources.limits.memory:
    displayName: Memory limit
    config:
      type: string
