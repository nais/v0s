# v0s in dev-nais, applied by hand to the management cluster (nais-system).
# Runs as v13s's service account; see docs/verification.md. Remove with
# `kubectl delete -f` on this file; the database goes with the Cluster object.
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: v0s-db
  namespace: nais-system
  labels:
    app: v0s
spec:
  instances: 1
  imageName: ghcr.io/cloudnative-pg/postgresql:18
  enableSuperuserAccess: false
  bootstrap:
    initdb:
      database: v0s
      owner: v0s
  storage:
    size: 10Gi
    # standard-rwo (pd-balanced) cannot attach to the n4 nodes in management.
    storageClass: dynamic-rwo
  resources:
    requests:
      cpu: 100m
      memory: 512Mi
    limits:
      memory: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: v0s
  namespace: nais-system
  labels:
    app: v0s
spec:
  replicas: 1
  selector:
    matchLabels:
      app: v0s
  template:
    metadata:
      labels:
        app: v0s
    spec:
      serviceAccountName: v13s-sa
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: v0s
          image: europe-north1-docker.pkg.dev/nais-io/nais/images/v0s@sha256:5ed10e7e7199e82f5537fe9f7fe698d233009d53af1598cea1c60ecba1cd031a
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: v0s-db-app
                  key: uri
            - name: TENANT
              value: dev-nais
            - name: CLUSTERS
              value: dev
            - name: GITHUB_ORGANIZATIONS
              value: nais,navikt
            - name: AUTH_AUDIENCE
              value: v0s
            - name: AUTHORIZED_SERVICE_ACCOUNTS
              value: v13s-sa@nais-management-7178.iam.gserviceaccount.com
            - name: TRIVY_DB_REPOSITORIES
              value: europe-north1-docker.pkg.dev/nais-io/github-ptc/aquasecurity/trivy-db:2,ghcr.io/aquasecurity/trivy-db:2
            # Sigstore caches its TUF trust root under $HOME/.sigstore.
            - name: HOME
              value: /var/cache/v0s/home
            - name: TRIVY_DB_DIR
              value: /var/cache/v0s/trivy-db
          ports:
            - name: grpc
              containerPort: 50051
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            failureThreshold: 6
            periodSeconds: 20
          resources:
            requests:
              cpu: 200m
              memory: 1Gi
            limits:
              memory: 3Gi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: cache
              mountPath: /var/cache/v0s
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: cache
          emptyDir:
            sizeLimit: 4Gi
        - name: tmp
          emptyDir:
            sizeLimit: 1Gi
---
apiVersion: v1
kind: Service
metadata:
  name: v0s
  namespace: nais-system
  labels:
    app: v0s
spec:
  selector:
    app: v0s
  ports:
    - name: grpc
      port: 50051
      targetPort: grpc
    - name: http
      port: 8080
      targetPort: http
---
# nais-system denies egress by default; default-allow-apiserver-and-dns covers DNS
# and the management cluster's own API server.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: v0s
  namespace: nais-system
spec:
  podSelector:
    matchLabels:
      app: v0s
  policyTypes: [Egress]
  egress:
    - to:
        - podSelector:
            matchLabels:
              cnpg.io/cluster: v0s-db
      ports:
        - port: 5432
    - to:
        - ipBlock:
            cidr: 169.254.169.254/32
      ports:
        - port: 80
---
# CNPG creates no ingress rules, and the database pods need no extra egress:
# nais-system denies only egress, and the operator reaches them through
# cloudnative-pg-to-nais-system.
apiVersion: networking.gke.io/v1alpha3
kind: FQDNNetworkPolicy
metadata:
  name: v0s-fqdn
  namespace: nais-system
spec:
  podSelector:
    matchLabels:
      app: v0s
  egress:
    - ports:
        - port: 443
          protocol: TCP
      to:
        - fqdns:
            - apiserver.dev.dev-nais.cloud.nais.io
            - europe-north1-docker.pkg.dev
            - ghcr.io
            - pkg-containers.githubusercontent.com
            # Registries of other images in the dev cluster: v0s looks up their
            # attestations, and records them as missing only if it gets an answer.
            - index.docker.io
            - registry-1.docker.io
            - auth.docker.io
            - production.cloudflare.docker.com
            - gcr.io
            - gke.gcr.io
            - quay.io
            - registry.k8s.io
            - us-central1-docker.pkg.dev
            - reg.kyverno.io
            - tuf-repo-cdn.sigstore.dev
            - sigstore-tuf-root.storage.googleapis.com
            - www.googleapis.com
            - oauth2.googleapis.com
            - private.googleapis.com
            - epss.empiricalsecurity.com
            - www.cisa.gov
